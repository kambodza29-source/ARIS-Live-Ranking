<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.R.I.S. Hall of Fame – Live Ranking</title>
<style>
:root{--bg:#080a0d;--panel:#101318;--line:#2a2f37;--red:#d5222a;--gold:#f0bd45;--text:#f2f2f2;--muted:#969da7}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:#060708;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:url('background.jpg') center center / cover no-repeat;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 50% 0%,rgba(70,10,14,.10),rgba(4,5,7,.22) 55%,rgba(3,4,5,.34) 100%),
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.22));
}
.wrap{max-width:1180px;margin:auto;padding:24px 14px 50px}.hero{text-align:center;padding:24px 10px 16px}.hero h1{font-size:clamp(32px,7vw,64px);letter-spacing:4px;margin:0;text-shadow:0 0 22px #b0181e}.hero h1 b{color:var(--red)}.sub{color:var(--muted);letter-spacing:3px;margin-top:7px}.meta{margin-top:12px;color:#c9cdd2;font-size:14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px;position:sticky;top:0;background:rgba(8,10,13,.72);backdrop-filter:blur(8px);z-index:5}.tab{border:1px solid #353b45;background:#11151b;color:#d9dde2;padding:11px 14px;border-radius:7px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{border-color:var(--red);background:#2a1013;color:#fff;box-shadow:0 0 14px #a7192044}.tools{display:flex;gap:10px;margin:4px 0 12px}.search{width:100%;background:#0d1015;border:1px solid #303640;border-radius:7px;color:#fff;padding:13px 15px;font-size:16px;outline:none}.search:focus{border-color:var(--red)}.card{background:linear-gradient(180deg,rgba(19,23,29,.84),rgba(13,16,20,.80));border:1px solid #292f37;border-top:3px solid var(--red);border-radius:10px;overflow:hidden;box-shadow:0 15px 40px #0008}.head,.row{display:grid;grid-template-columns:70px minmax(130px,1fr) minmax(110px,220px);align-items:center;gap:8px}.head{padding:12px 14px;background:#171b21;color:var(--muted);font-size:12px;font-weight:bold;letter-spacing:1px}.row{padding:14px;border-top:1px solid #22272e;min-height:62px}.row:hover{background:#171b21}.pos{font-size:19px;font-weight:900}.name{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis}.value{text-align:right;color:var(--gold);font-weight:900;font-size:17px}.detail{font-size:12px;color:var(--muted);margin-top:4px;font-weight:normal}.rank1 .pos,.rank1 .name{color:#ffd35c}.rank2 .pos{color:#d5d9df}.rank3 .pos{color:#c98b55}.empty{text-align:center;color:var(--muted);padding:40px}.foot{text-align:center;color:#656c75;font-size:12px;padding:20px}.live{color:#55d27b;font-weight:bold}.dot{display:inline-block;width:8px;height:8px;background:#55d27b;border-radius:50%;box-shadow:0 0 8px #55d27b;margin-right:6px}.stafftab{border-color:#596273}.stafftab.active{border-color:#8f9bad;background:#18202a;box-shadow:0 0 14px #8795a744}.staffrow .pos{color:#9ca9b8}.staffrow .value{color:#aeb8c5}
@media(max-width:560px){.wrap{padding:10px 8px 35px}.hero{padding-top:18px}.head,.row{grid-template-columns:52px minmax(100px,1fr) minmax(90px,135px)}.row{padding:12px 9px}.name{font-size:16px}.value{font-size:15px}.head{padding:10px 9px}.sub{font-size:11px}.tabs{top:0}}

/* --- A.R.I.S. radial category menu --- */
.tabs{
  display:grid !important;
  grid-template-columns:repeat(6,minmax(120px,1fr));
  gap:12px !important;
  overflow:visible !important;
  padding:12px 0 18px !important;
  position:relative !important;
  top:auto !important;
  background:transparent !important;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  min-height:54px;
  border-radius:16px !important;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  position:relative;
  overflow:hidden;
}
.tab:hover{
  transform:translateY(-3px) scale(1.02);
  border-color:#e33 !important;
  box-shadow:0 0 18px rgba(255,50,50,.28), inset 0 0 18px rgba(255,50,50,.05);
  background:linear-gradient(180deg,rgba(35,18,20,.95),rgba(16,18,22,.95)) !important;
}
.tab:focus-visible{
  outline:2px solid #ff3b3b;
  outline-offset:2px;
}
.tab.active{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(255,45,45,.35);
}
.stafftab:hover{
  border-color:#94a3b8 !important;
  box-shadow:0 0 18px rgba(148,163,184,.24);
}
@media(max-width:1050px){
  .tabs{grid-template-columns:repeat(4,minmax(135px,1fr));}
}
@media(max-width:760px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));}
  .tab{min-height:50px;font-size:13px}
}

</style>
</head>
<body><main class="wrap"><section class="hero"><h1><b>A.R.I.S.</b> HALL OF FAME</h1><div class="sub">LIVE RANKING • DAYZ EMPIRE APO</div><div class="meta"><span class="dot"></span><span class="live">LIVE</span> &nbsp;•&nbsp; <span id="meta">načítám data…</span></div></section><nav class="tabs" id="tabs"></nav><div class="tools"><input class="search" id="search" placeholder="🔎 Najít hráče…" autocomplete="off"></div><section class="card"><div class="head"><div>POŘADÍ</div><div>HRÁČ</div><div style="text-align:right">VÝKON</div></div><div id="rows"></div></section><div class="foot">A.R.I.S. • SURVIVE / EXPLORE / BE A LEGEND</div></main>
<script>
const cats={
  aris_score:{
    label:'🏆 A.R.I.S. SCORE',
    fmt:p=>`${Number(p.aris_score||0).toLocaleString('cs-CZ')} bodů`,
    detail:p=>{
      const parts=[];
      if(p.ai_kills) parts.push(`${p.ai_kills} AI`);
      if(p.longest_ai_kill_m) parts.push(`${p.longest_ai_kill_m} m`);
      if(p.vehicle_trip_straightline_m) parts.push(`${Number(p.vehicle_trip_straightline_m).toLocaleString('cs-CZ',{maximumFractionDigits:1})} m jízdy`);
      return parts.join(' • ');
    }
  },
  ai_hunter:{
    label:'AI HUNTER',
    fmt:p=>`${p.ai_kills||0} killů`,
    detail:p=>p.favorite_weapon?`Nejčastěji: ${p.favorite_weapon}`:''
  },
  longest_shot:{
    label:'LONG SHOT',
    fmt:p=>`${p.longest_ai_kill_m||0} m`,
    detail:p=>p.longest_ai_kill_weapon||''
  },
  most_deaths:{
    label:'MOST DEATHS',
    fmt:p=>`${p.deaths||0}×`,
    detail:p=>''
  },
  trader_king:{
    label:'TRADER KING',
    fmt:p=>`${Number(p.market_income||0).toLocaleString('cs-CZ')} ₴`,
    detail:p=>`${p.market_sales||0} prodejů`
  },
  road_warrior:{
    label:'ROAD WARRIOR',
    fmt:p=>`${Number(p.vehicle_trip_straightline_m||0).toLocaleString('cs-CZ',{maximumFractionDigits:1})} m`,
    detail:p=>`${p.vehicle_trips||0} jízd`
  },
  weapon_master:{
    label:'WEAPON MASTER',
    fmt:p=>`${p.weapon_master_kills||0} killů`,
    detail:p=>p.favorite_weapon?`Zbraň: ${p.favorite_weapon}`:''
  },
  ai_kd:{
    label:'AI K/D',
    fmt:p=>Number(p.ai_kd_ratio||0).toLocaleString('cs-CZ',{maximumFractionDigits:2}),
    detail:p=>`${p.ai_kills||0} AI killů • ${p.deaths||0} úmrtí`
  },
  salesman:{
    label:'SALESMAN',
    fmt:p=>`${p.market_sales||0} prodejů`,
    detail:p=>`${Number(p.market_income||0).toLocaleString('cs-CZ')} ₴ celkem`
  },
  trip_master:{
    label:'TRIP MASTER',
    fmt:p=>`${p.vehicle_trips||0} jízd`,
    detail:p=>`${Number(p.vehicle_trip_straightline_m||0).toLocaleString('cs-CZ',{maximumFractionDigits:1})} m celkem`
  },
  staff:{
    label:'🛡️ A.R.I.S. STAFF',
    staff:true,
    fmt:p=>'STAFF',
    detail:p=>{
      const parts=[];
      parts.push(`${p.ai_kills||0} AI`);
      if(p.longest_ai_kill_m) parts.push(`${p.longest_ai_kill_m} m`);
      if(p.vehicle_trip_straightline_m) parts.push(`${Number(p.vehicle_trip_straightline_m).toLocaleString('cs-CZ',{maximumFractionDigits:1})} m jízdy`);
      return parts.join(' • ');
    }
  }
};

let data=null,active='aris_score';
const tabs=document.getElementById('tabs'),
      rows=document.getElementById('rows'),
      search=document.getElementById('search');

function buildTabs(){
  tabs.innerHTML='';
  Object.entries(cats).forEach(([id,c])=>{
    let b=document.createElement('button');
    b.className='tab'+(id===active?' active':'')+(c.staff?' stafftab':'');
    b.textContent=c.label;
    b.title='Zobrazit kategorii: '+c.label;
    b.onclick=()=>{active=id;buildTabs();render()};
    tabs.appendChild(b);
  });
}

function render(){
  if(!data)return;
  let q=search.value.trim().toLocaleLowerCase('cs');
  let list=data[active]||[];
  let html='';

  list.forEach((p,i)=>{
    if(q&&!String(p.name).toLocaleLowerCase('cs').includes(q))return;
    let c=cats[active],det=c.detail(p);
    let pos=c.staff?'🛡️':`${i+1}.`;
    html+=`<div class="row ${c.staff?'staffrow':'rank'+(i+1)}">
      <div class="pos">${pos}</div>
      <div class="name">${esc(p.name)}${det?`<div class="detail">${esc(det)}</div>`:''}</div>
      <div class="value">${esc(c.fmt(p))}</div>
    </div>`;
  });

  rows.innerHTML=html||`<div class="empty">${cats[active].staff?'Žádný člen STAFF není nastaven.':'Žádný hráč v této kategorii.'}</div>`;
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

search.addEventListener('input',render);
buildTabs();

fetch('leaderboard.json?'+Date.now())
  .then(r=>{if(!r.ok)throw Error(r.status);return r.json()})
  .then(j=>{
    data=j;
    const staff=Number(j.staff_count||0);
    document.getElementById('meta').textContent=
      `hráčů: ${j.player_count} • STAFF: ${staff} • sezóna od ${j.season_start} • aktualizace ${j.updated_at_local||''}`;
    render();
  })
  .catch(e=>{
    document.getElementById('meta').textContent='data se nepodařilo načíst';
    rows.innerHTML='<div class="empty">LIVE RANKING zatím nemá dostupná data.</div>';
  });
</script></body></html>
